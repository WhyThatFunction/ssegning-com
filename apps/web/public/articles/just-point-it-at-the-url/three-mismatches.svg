<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" width="840" height="380" role="img" aria-labelledby="title desc">
  <title id="title">Three failures, one layer below the request</title>
  <desc id="desc">Three services failed for three different reasons: an empty SNI in the TLS hello, a BAD_ECC_CERT rejection of a valid ECDSA certificate, and a JSON body labelled Content-Type text/event-stream that gave 0 tools. A small Caddy reverse proxy in front of each absorbs the mismatch.</desc>
  <style>
    .bg { fill: #f8f3f0; }
    .ink { fill: #0a0a0a; }
    .muted { fill: #5e5d5b; }
    .rule { stroke: #d8d5d1; }
    .ctx { fill: #5e5d5b; fill-opacity: 0.35; }
    .hi { fill: #b23a0a; }
    .box { fill: none; stroke: #d8d5d1; }
    .hibox { fill: none; stroke: #b23a0a; }
    .accent { fill: #b23a0a; }
    .mono { font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; letter-spacing: 0.12em; }
    .label { font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 15px; }
    .small { font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 13px; }
    .value { font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1b1818; }
      .ink { fill: #f2efea; }
      .muted { fill: #a8a29c; }
      .rule { stroke: #3a3436; }
      .ctx { fill: #a8a29c; fill-opacity: 0.35; }
      .hi, .accent { fill: #fb923c; }
      .box { stroke: #3a3436; }
      .hibox { stroke: #fb923c; }
    }
  </style>

  <rect class="bg" width="840" height="380"/>
  <text class="mono muted" x="40" y="48">THREE SERVICES · THREE MISMATCHES · NONE FIXABLE AT THE URL</text>
  <rect class="box" x="40" y="72" width="240" height="250" rx="6"/>
  <text class="mono muted" x="60" y="102">SUSPECT 1</text>
  <text class="label ink" x="60" y="134" style="font-weight:600">Empty SNI</text>
  <text class="small muted" x="60" y="164">TLS hello names no host,</text>
  <text class="small muted" x="60" y="182">the CDN can't pick a cert</text>
  <line class="rule" x1="60" y1="204" x2="260" y2="204" stroke-width="1"/>
  <text class="mono muted" x="60" y="230">RESULT</text>
  <text class="label accent" x="60" y="254">Handshake dies</text>
  <text class="small ink" x="60" y="300">Fix: proxy sets SNI</text>
  <rect class="box" x="300" y="72" width="240" height="250" rx="6"/>
  <text class="mono muted" x="320" y="102">SUSPECT 2</text>
  <text class="label ink" x="320" y="134" style="font-weight:600">BAD_ECC_CERT</text>
  <text class="small muted" x="320" y="164">Valid ECDSA cert, rejected</text>
  <text class="small muted" x="320" y="182">by the gateway's TLS engine</text>
  <line class="rule" x1="320" y1="204" x2="520" y2="204" stroke-width="1"/>
  <text class="mono muted" x="320" y="230">RESULT</text>
  <text class="label accent" x="320" y="254">Cert rejected</text>
  <text class="small ink" x="320" y="300">Fix: proxy does TLS itself</text>
  <rect class="box" x="560" y="72" width="240" height="250" rx="6"/>
  <text class="mono muted" x="580" y="102">SUSPECT 3</text>
  <text class="label ink" x="580" y="134" style="font-weight:600">text/event-stream</text>
  <text class="small muted" x="580" y="164">Valid JSON body, wrong</text>
  <text class="small muted" x="580" y="182">Content-Type header</text>
  <line class="rule" x1="580" y1="204" x2="780" y2="204" stroke-width="1"/>
  <text class="mono muted" x="580" y="230">RESULT</text>
  <text class="label accent" x="580" y="254">0 events → 0 tools</text>
  <text class="small ink" x="580" y="300">Fix: proxy rewrites to JSON</text>
  <text class="mono muted" x="40" y="360">A SMALL CADDY PROXY IN FRONT OF EACH SERVICE ABSORBS THE MISMATCH</text>
</svg>

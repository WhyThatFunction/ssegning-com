<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="840" height="330" role="img" aria-labelledby="title desc">
  <title id="title">The same box, three ways to count it</title>
  <desc id="desc">Over 36 months: 5,520 euros for 5 V100s in Cameroon counting hardware and power only, about 16,320 euros fully loaded with maintenance, 32,004 euros for the GEX131 rental at the old price, about 34,164 euros fully loaded.</desc>
  <style>
    .bg { fill: #f8f3f0; }
    .ink { fill: #0a0a0a; }
    .muted { fill: #5e5d5b; }
    .rule { stroke: #d8d5d1; }
    .ctx { fill: #5e5d5b; fill-opacity: 0.35; }
    .hi { fill: #b23a0a; }
    .box { fill: none; stroke: #d8d5d1; }
    .hibox { fill: none; stroke: #b23a0a; }
    .accent { fill: #b23a0a; }
    .mono { font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; letter-spacing: 0.12em; }
    .label { font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 15px; }
    .small { font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 13px; }
    .value { font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1b1818; }
      .ink { fill: #f2efea; }
      .muted { fill: #a8a29c; }
      .rule { stroke: #3a3436; }
      .ctx { fill: #a8a29c; fill-opacity: 0.35; }
      .hi, .accent { fill: #fb923c; }
      .box { stroke: #3a3436; }
      .hibox { stroke: #fb923c; }
    }
  </style>

  <rect class="bg" width="840" height="330"/>
  <text class="mono muted" x="40" y="48">36 MONTHS · EUROS · ONE 70B BOX</text>
  <!-- scale: 35 000 euros = 460px, from x=250 -->
  <text class="label ink" x="40" y="84">V100, hardware + power</text>
  <text class="small muted" x="40" y="102">Cameroon, typical load</text>
  <rect class="ctx" x="250" y="70" width="72.5" height="26" rx="3"/>
  <text class="value ink" x="332.5" y="88">€5 520</text>
  <text class="label ink" x="40" y="144">V100, fully loaded</text>
  <text class="small muted" x="40" y="162">with ~€300 / month maintenance</text>
  <rect class="hi" x="250" y="130" width="214.5" height="26" rx="3"/>
  <text class="value ink" x="474.5" y="148">€16 320</text>
  <text class="label ink" x="40" y="204">GEX131 rental</text>
  <text class="small muted" x="40" y="222">€889 / month × 36</text>
  <rect class="ctx" x="250" y="190" width="420.6" height="26" rx="3"/>
  <text class="value ink" x="680.6" y="208">€32 004</text>
  <text class="label ink" x="40" y="264">GEX131, fully loaded</text>
  <text class="small muted" x="40" y="282">rental + maintenance</text>
  <rect class="ctx" x="250" y="250" width="449.0" height="26" rx="3"/>
  <text class="value ink" x="709.0" y="268">€34 164</text>
  <line class="rule" x1="250" y1="62" x2="250" y2="300" stroke-width="1"/>
</svg>

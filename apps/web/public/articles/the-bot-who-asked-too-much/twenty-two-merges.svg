<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="840" height="330" role="img" aria-labelledby="title desc">
  <title id="title">22 pull requests in two days</title>
  <desc id="desc">The merge times of the 22 pull requests merged in the session, on two days in November 2026, Central European Time. Fourteen on 21 November, from 10:26 to 22:18; eight on 22 November, from 10:08 to 14:29. The session opened on 21 November at 10:08 with "Help me troubleshoot why". The last merge, at 14:29 on the second day, followed the message "Merge without asking me".</desc>
  <style>
    .bg { fill: #f8f3f0; }
    .ink { fill: #0a0a0a; }
    .muted { fill: #5e5d5b; }
    .rule { stroke: #d8d5d1; }
    .ctx { fill: #5e5d5b; fill-opacity: 0.45; }
    .hot, .hotText { fill: #b23a0a; }
    .hotline { stroke: #b23a0a; }
    .mutedline { stroke: #5e5d5b; }
    .mono { font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; letter-spacing: 0.12em; }
    .label { font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 15px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1b1818; }
      .ink { fill: #f2efea; }
      .muted { fill: #a8a29c; }
      .rule { stroke: #3a3436; }
      .ctx { fill: #a8a29c; fill-opacity: 0.45; }
      .hot, .hotText { fill: #fb923c; }
      .hotline { stroke: #fb923c; }
      .mutedline { stroke: #a8a29c; }
    }
  </style>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="840" height="330" role="img" aria-labelledby="title desc">
  <title id="title">Same model, two cards, two loaders</title>
  <desc id="desc">Same dense-70B model: about 60 to 100 tokens per second on Blackwell, about 20 to 30 on Volta, a 3 times gap. Same 4-bit model: about 741 tokens per second with the proper kernel, about 93 with vLLM's slow GGUF loader, about 8 times slower.</desc>
  <style>
    .bg { fill: #f8f3f0; }
    .ink { fill: #0a0a0a; }
    .muted { fill: #5e5d5b; }
    .rule { stroke: #d8d5d1; }
    .ctx { fill: #5e5d5b; fill-opacity: 0.35; }
    .hi { fill: #b23a0a; }
    .box { fill: none; stroke: #d8d5d1; }
    .hibox { fill: none; stroke: #b23a0a; }
    .accent { fill: #b23a0a; }
    .mono { font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; letter-spacing: 0.12em; }
    .label { font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 15px; }
    .small { font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 13px; }
    .value { font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1b1818; }
      .ink { fill: #f2efea; }
      .muted { fill: #a8a29c; }
      .rule { stroke: #3a3436; }
      .ctx { fill: #a8a29c; fill-opacity: 0.35; }
      .hi, .accent { fill: #fb923c; }
      .box { stroke: #3a3436; }
      .hibox { stroke: #fb923c; }
    }
  </style>

  <rect class="bg" width="840" height="330"/>

  <text class="mono muted" x="40" y="48">SAME DENSE-70B MODEL · TOKENS / SEC · 3× GAP</text>
  <!-- scale: 100 tok/s = 460px, from x=220 -->
  <text class="label ink" x="40" y="86">Blackwell</text>
  <rect class="ctx" x="496" y="68" width="184" height="26" rx="3"/>
  <text class="value ink" x="690" y="86">~60–100</text>
  <text class="label ink" x="40" y="130">Volta</text>
  <rect class="hi" x="312" y="112" width="46" height="26" rx="3"/>
  <text class="value ink" x="368" y="130">~20–30</text>
  <line class="rule" x1="220" y1="60" x2="220" y2="146" stroke-width="1"/>

  <line class="rule" x1="40" y1="176" x2="800" y2="176" stroke-width="1"/>

  <text class="mono muted" x="40" y="212">SAME 4-BIT MODEL · TOKENS / SEC · ~8× TAX</text>
  <!-- scale: 741 tok/s = 460px, from x=220 -->
  <text class="label ink" x="40" y="250">Proper kernel</text>
  <rect class="ctx" x="220" y="232" width="460" height="26" rx="3"/>
  <text class="value ink" x="690" y="250">~741</text>
  <text class="label ink" x="40" y="294">GGUF loader</text>
  <rect class="hi" x="220" y="276" width="57.7" height="26" rx="3"/>
  <text class="value ink" x="287" y="294">~93</text>
  <line class="rule" x1="220" y1="224" x2="220" y2="310" stroke-width="1"/>
</svg>

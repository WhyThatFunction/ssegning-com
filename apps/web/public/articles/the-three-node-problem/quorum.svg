<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="840" height="330" role="img" aria-labelledby="title desc">
  <title id="title">Majority of three is two</title>
  <desc id="desc">With three control-plane nodes the majority is two. With all 3 up, writes are OK. With 1 lost, 2 of 3 still agree and writes are OK. With 2 lost at once, 1 of 3 is not a majority: no writes and the API is frozen.</desc>
  <style>
    .bg { fill: #f8f3f0; }
    .ink { fill: #0a0a0a; }
    .muted { fill: #5e5d5b; }
    .rule { stroke: #d8d5d1; }
    .box { fill: none; stroke: #d8d5d1; }
    .accent { fill: #b23a0a; }
    .accent-stroke { stroke: #b23a0a; fill: none; }
    .up { fill: #5e5d5b; fill-opacity: 0.35; stroke: #5e5d5b; }
    .down { fill: none; stroke: #5e5d5b; stroke-dasharray: 4 4; }
    .num { font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 300; font-size: 64px; letter-spacing: -0.02em; }
    .label { font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 15px; }
    .mono { font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; letter-spacing: 0.12em; }
    .mono-s { font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; letter-spacing: 0.06em; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1b1818; }
      .ink { fill: #f2efea; }
      .muted { fill: #a8a29c; }
      .rule { stroke: #3a3436; }
      .box { stroke: #3a3436; }
      .accent { fill: #fb923c; }
      .accent-stroke { stroke: #fb923c; }
      .up { fill: #a8a29c; fill-opacity: 0.35; stroke: #a8a29c; }
      .down { stroke: #a8a29c; }
    }
  </style>
  <rect class="bg" width="840" height="330"/>
  <text class="mono muted" x="40" y="56">THREE CONTROL-PLANE NODES · MAJORITY = 2</text>

  <g>
    <circle class="up" cx="80" cy="130" r="24"/><circle class="up" cx="150" cy="130" r="24"/><circle class="up" cx="220" cy="130" r="24"/>
    <text class="num ink" x="40" y="236" font-size="56">3</text>
    <text class="mono muted" x="42" y="262">OF 3 UP</text>
    <text class="mono ink" x="42" y="290">WRITES OK</text>
  </g>
  <g>
    <circle class="up" cx="360" cy="130" r="24"/><circle class="up" cx="430" cy="130" r="24"/><circle class="down" cx="500" cy="130" r="24"/>
    <text class="num ink" x="320" y="236" font-size="56">2</text>
    <text class="mono muted" x="322" y="262">OF 3 UP · LOSE 1</text>
    <text class="mono ink" x="322" y="290">WRITES OK</text>
  </g>
  <g>
    <circle class="down" cx="640" cy="130" r="24"/><circle class="down" cx="710" cy="130" r="24"/><circle class="up" cx="780" cy="130" r="24" style="stroke-width:3"/>
    <text class="num accent" x="600" y="236" font-size="56">1</text>
    <text class="mono muted" x="602" y="262">OF 3 UP · LOSE 2</text>
    <text class="mono accent" x="602" y="290">NO MAJORITY · API FROZEN</text>
  </g>
</svg>

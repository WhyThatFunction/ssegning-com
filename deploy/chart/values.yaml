# ssegning.com — Helm chart values.
#
# Deployed by ArgoCD onto the Talos in-cluster destination
# (server: https://kubernetes.default.svc), namespace `ssegning` (created by
# the ArgoCD Application, not by this chart). See README.md for a full
# breakdown of every key below and the exact AWS Secrets Manager properties
# this chart expects to exist under `ssegning/prod/env`.
#
# CI rewrites `.web.image.tag` and `.cms.image.tag` with `yq` on every
# deploy — keep those two paths as plain scalars.

web:
  image:
    repository: ghcr.io/whythatfunction/ssegning-com/web
    tag: sha-31cdb8b
    pullPolicy: IfNotPresent
  replicas: 2
  serviceName: ssegning-web
  port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi
  env:
    # NEXT_PUBLIC_SITE_URL is baked into client bundles at request time via
    # the App Router's server components — safe to keep as a plain (non-
    # secret) value.
    nextPublicSiteUrl: https://ssegning.com
  # giscus — GitHub-Discussions-backed comments under each journal article.
  # Readers sign in with their own GitHub account; nothing is stored by us.
  #
  # These are read SERVER-SIDE by the article page and passed to the client
  # component as props, which is why they are NOT named `NEXT_PUBLIC_*`.
  # A `NEXT_PUBLIC_` variable is inlined by Next.js at BUILD time, and these
  # images are built in CI with no giscus config — so a NEXT_PUBLIC name
  # would be permanently baked as `undefined` and no amount of Deployment
  # env here could ever switch comments on. Read at request time by a server
  # component, a change here takes effect on a pod restart, no rebuild.
  #
  # None of these are secrets: they are the public identifiers giscus's own
  # configurator hands out, and they end up in the page's script tag anyway.
  #
  # `Announcements` is giscus's recommended category type — only maintainers
  # can open discussions there, so every thread is created by the app rather
  # than by a reader.
  #
  # STILL REQUIRES ONE HUMAN STEP: the giscus GitHub App must be installed on
  # WhyThatFunction/ssegning-com (https://github.com/apps/giscus). Until then
  # the widget renders but reports "giscus is not installed on this
  # repository". The page itself degrades cleanly either way.
  giscus:
    enabled: true
    repo: WhyThatFunction/ssegning-com
    repoId: R_kgDOUKZKdQ
    category: Announcements
    categoryId: DIC_kwDOUKZKdc4DEoBK
cms:
  image:
    repository: ghcr.io/whythatfunction/ssegning-com/cms
    tag: sha-31cdb8b
    pullPolicy: IfNotPresent
  serviceName: ssegning-cms
  port: 1337
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1.5Gi
  env:
    publicUrl: https://cms.ssegning.com
    adminBackendUrl: https://cms.ssegning.com
    s3Endpoint: https://s3.ssegning.me
    s3Region: us-east-1
    s3Bucket: ssegning-uploads
    s3PublicBase: https://s3.ssegning.me/ssegning-uploads
    # Outbound mail + notifications, both routed through in-cluster relays
    # rather than talking to any upstream provider directly.
    #
    # smtpHost/smtpPort point at the `mail` Service in the `mail-system`
    # namespace (mail.mail-system.svc.cluster.local:587 — confirmed live,
    # that Service exposes ONLY 587, no 25/465). This is plain in-cluster
    # HTTP-equivalent traffic: it never leaves the cluster network, and the
    # postfix relay pod (mail-0) is the one that terminates the actual
    # outbound TLS connection to whatever upstream smart host it's
    # configured with — the CMS never talks to the public Internet for
    # mail. Port 587 is the submission port; TLS is disabled on this hop
    # (see apps/cms/config/plugins.ts for why), which means the
    # connection starts in plaintext and upgrades in-band, and — unlike
    # port 25 relaying — requires SASL authentication; that's what
    # SMTP_SASL_USERS (below, under externalSecrets.cms.mappings) supplies.
    #
    # emailDefaultFrom MUST be a domain the relay is actually willing to
    # relay for. The postfix relay is configured with an
    # ALLOWED_SENDER_DOMAINS allow-list, and a From address outside it gets
    # a hard postfix rejection at submission time, not a soft bounce later —
    # so changing this value requires confirming the new domain is also
    # added on the relay side first.
    smtpHost: mail.mail-system.svc.cluster.local
    smtpPort: 587
    # Realm the SASL username is qualified with before authenticating
    # (user -> user@localdomain) — see the mechanism comment on
    # qualifySaslUser in apps/cms/src/lib/smtp-credentials.ts. Required
    # because the relay's own config has `mydomain = localdomain` and an
    # EMPTY `smtpd_sasl_local_domain`: its Cyrus sasldb stores exactly one
    # entry, literally `user@localdomain`, and a bare username resolves
    # against `myhostname` (`mail-0`) instead, failing auth with a
    # `535 5.7.8`. This value MUST track the relay's own config in
    # home-os — if the relay ever sets `smtpd_sasl_local_domain` to a
    # non-empty value, or changes `mydomain` off `localdomain`, this needs
    # to change with it, or outbound mail breaks again.
    smtpSaslRealm: localdomain
    emailDefaultFrom: no-reply@ssegning.com
    emailDefaultReplyTo: hello@ssegning.com
    # Apprise (apprise.notification-system.svc.cluster.local:8000, also
    # in-cluster only) is stateless: it has no persistent notion of "this
    # app's configured channels" the way e.g. a webhook-management SaaS
    # would. Every request carries its own target notification URL(s), so
    # appriseAlertTo isn't a channel identifier stored in Apprise — it's
    # the address the CMS itself passes as APPRISE_ALERT_TO on each call.
    # That makes this the swap point for moving alerts off email later
    # (Slack, PagerDuty, ntfy, ...): change appriseAlertTo/APPRISE_ALERT_TO
    # to a different Apprise-supported URL scheme and nothing else in this
    # chart needs to move.
    appriseUrl: http://apprise.notification-system.svc.cluster.local:8000
    appriseAlertTo: hello@ssegning.com
postgres:
  name: ssegning-pg
  instances: 1
  # Patch-pinned, not a floating major/OS-flavour tag, so a routine pod
  # restart never silently pulls a newer Postgres minor onto a live
  # database. Verified live against
  # https://ghcr.io/v2/cloudnative-pg/postgresql/manifests/18.1-system-trixie
  # (200 OK, multi-arch OCI image index) before pinning; the identical tag
  # already runs in production for keycloak-ha on this same cluster.
  imageName: "ghcr.io/cloudnative-pg/postgresql:18.1-system-trixie"
  database: ssegning
  owner: ssegning
  port: 5432
  storage:
    size: 10Gi
    storageClass: longhorn
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
# barman-cloud backups + WAL archival for the ssegning-pg CNPG Cluster (see
# templates/postgres.yaml). Bucket/path/endpoint are non-secret config, kept
# separate from the S3 credentials themselves (externalSecrets.backup below)
# to mirror the existing convention in this file.
backup:
  enabled: true
  endpoint: https://s3.ssegning.me
  # Deliberately a DIFFERENT bucket than cms.env.s3Bucket (ssegning-uploads,
  # public media). Backups contain full database dumps and must never sit
  # in a world-readable bucket.
  bucket: ssegning-cnpg-backups
  path: /ssegning-prod
  retention: 30d
  # CNPG ScheduledBackup.spec.schedule is a SIX-field cron (seconds first),
  # not the usual 5-field crontab — see the comment on this field in
  # templates/postgres.yaml. Daily at 03:00.
  schedule: "0 0 3 * * *"
externalSecrets:
  enabled: true
  storeName: ssegning-aws
  storeKind: ClusterSecretStore
  remoteKey: ssegning/prod/env
  refreshInterval: 1h
  # S3 credentials for the barman-cloud ObjectStore above. Deliberately
  # reuses the SAME s3_access_key/s3_secret_key remote properties as the
  # CMS's S3_ACCESS_KEY_ID/S3_SECRET_ACCESS_KEY mapping (externalSecrets.cms
  # above) — it's the same MinIO user/access key at s3.ssegning.me, now also
  # granted access to the private ssegning-cnpg-backups bucket in addition
  # to the public ssegning-uploads media bucket. Materialized into its own
  # Secret (not folded into an existing one) because barman-cloud's
  # s3Credentials contract expects exactly `accessKeyId`/`secretKey` keys.
  backup:
    secretName: ssegning-cnpg-s3-creds
    accessKeyRemoteProperty: s3_access_key
    secretKeyRemoteProperty: s3_secret_key
  # Seeds the CNPG bootstrap owner role's password (see templates/postgres.yaml
  # bootstrap.initdb.secret) with a value from Secrets Manager rather than
  # CNPG's own auto-generated one, so the same password is knowable/rotatable
  # from one place and reusable by the CMS's DATABASE_PASSWORD.
  postgresOwner:
    secretName: ssegning-pg-owner
    username: ssegning
    passwordRemoteProperty: postgres_password
  # Strapi (CMS) runtime secrets. `remoteProperty` is the exact property
  # name under the `ssegning/prod/env` secret in AWS Secrets Manager.
  cms:
    secretName: ssegning-cms-secrets
    mappings:
      - key: APP_KEYS
        remoteProperty: strapi_app_keys
      - key: API_TOKEN_SALT
        remoteProperty: strapi_api_token_salt
      - key: ADMIN_JWT_SECRET
        remoteProperty: strapi_admin_jwt_secret
      - key: TRANSFER_TOKEN_SALT
        remoteProperty: strapi_transfer_token_salt
      - key: JWT_SECRET
        remoteProperty: strapi_jwt_secret
      - key: ENCRYPTION_KEY
        remoteProperty: strapi_encryption_key
      - key: S3_ACCESS_KEY_ID
        remoteProperty: s3_access_key
      - key: S3_SECRET_ACCESS_KEY
        remoteProperty: s3_secret_key
      - key: WEB_REVALIDATE_SECRET
        remoteProperty: revalidate_secret
      - key: DATABASE_PASSWORD
        remoteProperty: postgres_password
      # Super-admin bootstrap (CONTRACT.md ADDENDUM 1). apps/cms creates
      # exactly one Strapi super admin from these on first boot (when
      # admin::user count is 0), closing the open-registration window that
      # would otherwise let the first visitor to /admin claim the instance.
      - key: ADMIN_EMAIL
        remoteProperty: admin_email
      - key: ADMIN_PASSWORD
        remoteProperty: admin_password
      - key: ADMIN_FIRSTNAME
        remoteProperty: admin_firstname
      - key: ADMIN_LASTNAME
        remoteProperty: admin_lastname
      # The ONE mapping in this list that reads a different AWS Secrets
      # Manager secret than the rest (via the optional per-mapping
      # `remoteKey` override in templates/external-secrets.yaml). This is
      # the shared infra credential the `mail` SMTP relay itself is
      # configured with (its own smtpd_sasl_users property) — not
      # something owned by this app — so keeping it in prod/meta/test-app
      # and reading it from there means rotating it in one place keeps the
      # relay and every client of it in sync. It's the same
      # prod/meta/test-app secret imagePullSecret.remoteKey (below) already
      # reads.
      - key: SMTP_SASL_USERS
        remoteKey: prod/meta/test-app
        remoteProperty: smtpd_sasl_users
  # Next.js (web) runtime secret. Must equal the CMS's WEB_REVALIDATE_SECRET
  # (both map from the same `revalidate_secret` remote property) — the web
  # app's /api/revalidate route checks incoming requests against this value.
  web:
    secretName: ssegning-web-secrets
    mappings:
      - key: REVALIDATE_SECRET
        remoteProperty: revalidate_secret
# Credential the kubelet uses to pull the two GHCR images. Needed because a
# GHCR package published by CI is private by default even from a public repo,
# and package visibility cannot be changed through any API -- see the long
# comment in templates/external-secrets.yaml.
imagePullSecret:
  enabled: true
  name: ghcr-pull
  # Shared fleet credential (github_username / github_token), the same one the
  # vaam-store and vymalo deployers pull ghcr.io with.
  remoteKey: prod/meta/test-app
certificate:
  secretName: ssegning-tls
  issuerName: cert-cloudflare
  issuerKind: ClusterIssuer
  # No wildcard requested for this domain, so no dnsNames pruning needed
  # (see the "wildcard-only, no commonName" convention used elsewhere on
  # this cluster — that rule exists to stop Let's Encrypt 400ing an order
  # where a name is redundant with a wildcard in the same request; none of
  # these five names overlap that way).
  dnsNames:
    - ssegning.com
    - www.ssegning.com
    - cms.ssegning.com
    - god.ssegning.com
    - apps.ssegning.com
    - blog.ssegning.com
ingress:
  className: traefik
  tlsSecretName: ssegning-tls
  web:
    host: ssegning.com
  cms:
    host: cms.ssegning.com
  # Whole hostnames that exist only to 301 somewhere else. Each entry renders
  # its own Ingress plus a PAIR of Traefik Middlewares (see
  # templates/middleware.yaml).
  #
  # None of these hosts may also appear on `ingress.web`/`ingress.cms` above:
  # two Ingress objects declaring an identical Host+PathPrefix router for one
  # hostname (one plain, one middleware-wrapped) is an undefined-priority
  # collision in Traefik, not a "last one wins."
  #
  # WHY TWO MIDDLEWARES PER ENTRY, not one. A single
  # `^https?://[^/]+/(.*)` -> `<target>/${1}` rule sends the bare root to
  # `<target>/` with a trailing slash. That is harmless for a target with no
  # path (`https://ssegning.com/` IS the root) but wrong for one that has a
  # path: `blog.ssegning.com` would land on `https://ssegning.com/journal/`,
  # which Next.js then 308s again to `/journal` because `trailingSlash` is
  # false. Two chained rules — an exact-root rule and a has-a-path rule —
  # make every hop land on its final URL directly. Traefik evaluates the
  # chain in order and a redirectRegex that does not match simply falls
  # through to the next one.
  redirects:
    - name: to-apex
      ingressName: ssegning-redirect
      targetUrl: https://ssegning.com
      hosts:
        - www.ssegning.com
        - god.ssegning.com
        - apps.ssegning.com
    # blog.ssegning.com is a legacy/vanity hostname for the writing, so it
    # maps onto the journal rather than the apex, preserving the slug:
    # blog.ssegning.com/pandoras-bucket -> ssegning.com/journal/pandoras-bucket.
    - name: to-journal
      ingressName: ssegning-blog-redirect
      targetUrl: https://ssegning.com/journal
      hosts:
        - blog.ssegning.com

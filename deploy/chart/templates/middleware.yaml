{{- range .Values.ingress.redirects }}
---
# Traefik Middlewares for the `{{ .name }}` redirect group -> {{ .targetUrl }}
#
# A PAIR, chained in this order by the Ingress's
# traefik.ingress.kubernetes.io/router.middlewares annotation:
#
#   <name>-root   matches ONLY the bare root ("/" or no path) and sends it to
#                 the target verbatim, with no trailing slash appended.
#   <name>-path   matches anything with a real path and appends it.
#
# Splitting them is what keeps every redirect a SINGLE hop. One combined
# `/(.*)` rule would rewrite the bare root to `<target>/`, and for a target
# that carries a path (e.g. .../journal) Next.js then 308s that again to
# drop the trailing slash. Traefik runs the chain in order and a
# redirectRegex whose pattern does not match falls through untouched, so
# root requests are answered by the first rule and everything else by the
# second.
#
# `${1}` is a literal Traefik regexp-replacement token, not a Helm action
# (no double-curly delimiters), so Helm passes it through untouched. Quoted
# regardless so YAML never gets a chance to misparse the `$`.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .name }}-root
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: ssegning-com
spec:
  redirectRegex:
    regex: "^https?://[^/]+/?$"
    replacement: "{{ .targetUrl }}"
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .name }}-path
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: ssegning-com
spec:
  redirectRegex:
    regex: "^https?://[^/]+/(.+)"
    replacement: "{{ .targetUrl }}/${1}"
    permanent: true
{{- end }}

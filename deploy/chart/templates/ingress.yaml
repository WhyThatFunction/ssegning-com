---
# Apex Ingress — ssegning.com only. Deliberately does NOT also list
# www.ssegning.com as a host here (see values.yaml ingress.redirect's
# comment): www is handled exclusively by the ssegning-redirect Ingress
# below so there is only ever one Ingress object declaring a router for any
# given hostname.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.web.serviceName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.web.serviceName }}
    app.kubernetes.io/part-of: ssegning-com
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - secretName: {{ .Values.ingress.tlsSecretName }}
      hosts:
        - {{ .Values.ingress.web.host }}
  rules:
    - host: {{ .Values.ingress.web.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.web.serviceName }}
                port:
                  number: {{ .Values.web.port }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.cms.serviceName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.cms.serviceName }}
    app.kubernetes.io/part-of: ssegning-com
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - secretName: {{ .Values.ingress.tlsSecretName }}
      hosts:
        - {{ .Values.ingress.cms.host }}
  rules:
    - host: {{ .Values.ingress.cms.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.cms.serviceName }}
                port:
                  number: {{ .Values.cms.port }}
---
# Redirect Ingresses — one per entry in `ingress.redirects` (values.yaml).
# Every hostname here exists only to 301 somewhere else; none of them serve
# content.
#
# A real backend Service is still required even though the middleware chain
# short-circuits every request before it could reach it: Kubernetes' Ingress
# schema has no "middleware-only, no backend" shape, and Traefik refuses to
# build a router with no default backend at all. Pointing it at ssegning-web
# is arbitrary (it is never actually invoked) but keeps these Ingresses
# self-contained rather than inventing a dummy Service.
#
# The annotation lists BOTH middlewares of the pair, root first — see
# middleware.yaml for why the split exists. The reference format is
# `<namespace>-<middlewareName>@kubernetescrd`.
{{- range .Values.ingress.redirects }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .ingressName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .ingressName }}
    app.kubernetes.io/part-of: ssegning-com
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: "{{ $.Release.Namespace }}-{{ .name }}-root@kubernetescrd,{{ $.Release.Namespace }}-{{ .name }}-path@kubernetescrd"
spec:
  ingressClassName: {{ $.Values.ingress.className }}
  tls:
    - secretName: {{ $.Values.ingress.tlsSecretName }}
      hosts:
        {{- toYaml .hosts | nindent 8 }}
  rules:
    {{- range .hosts }}
    - host: {{ . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $.Values.web.serviceName }}
                port:
                  number: {{ $.Values.web.port }}
    {{- end }}
{{- end }}

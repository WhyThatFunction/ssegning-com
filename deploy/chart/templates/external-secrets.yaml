{{- $es := .Values.externalSecrets -}}
{{- if $es.enabled }}
---
# Seeds the CNPG bootstrap owner role's password (postgres.yaml's
# bootstrap.initdb.secret) from AWS Secrets Manager rather than letting CNPG
# auto-generate one, so the same value is knowable/rotatable from Secrets
# Manager and reused as the CMS's DATABASE_PASSWORD below.
#
# Helm pre-install/pre-upgrade hook, weight -10 — ArgoCD honours Helm hooks
# as Argo hooks (this is intended, not a workaround), so this Secret is
# guaranteed to exist before the plain-Sync-phase CNPG Cluster is applied.
# CNPG's bootstrap.initdb.secret contract expects exactly two keys:
# `username` and `password` — hence the explicit target.template below
# rather than the flatter secretKey-per-property form used for the other
# two ExternalSecrets in this file.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $es.postgresOwner.secretName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    name: {{ $es.storeName }}
    kind: {{ $es.storeKind }}
  target:
    name: {{ $es.postgresOwner.secretName }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: {{ $es.postgresOwner.username | quote }}
        password: {{ printf "{{ .%s }}" $es.postgresOwner.passwordRemoteProperty | quote }}
  data:
    - secretKey: {{ $es.postgresOwner.passwordRemoteProperty | quote }}
      remoteRef:
        key: {{ $es.remoteKey | quote }}
        property: {{ $es.postgresOwner.passwordRemoteProperty | quote }}
---
# Strapi (CMS) runtime secrets, including the ADMIN_* super-admin bootstrap
# credentials (CONTRACT.md ADDENDUM 1). No target.template needed here —
# each mapping's `key` is already the exact env var name cms.yaml wires via
# secretKeyRef, so the default flat Secret (one entry per `data[].secretKey`)
# is enough.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $es.cms.secretName }}
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    name: {{ $es.storeName }}
    kind: {{ $es.storeKind }}
  target:
    name: {{ $es.cms.secretName }}
    creationPolicy: Owner
  data:
    {{- range $es.cms.mappings }}
    - secretKey: {{ .key | quote }}
      remoteRef:
        key: {{ $es.remoteKey | quote }}
        property: {{ .remoteProperty | quote }}
    {{- end }}
---
# Next.js (web) runtime secret. Must equal the CMS's WEB_REVALIDATE_SECRET —
# both map from the same `revalidate_secret` remote property, so rotating
# one AWS Secrets Manager value keeps both sides in sync automatically on
# the next refreshInterval tick.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $es.web.secretName }}
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    name: {{ $es.storeName }}
    kind: {{ $es.storeKind }}
  target:
    name: {{ $es.web.secretName }}
    creationPolicy: Owner
  data:
    {{- range $es.web.mappings }}
    - secretKey: {{ .key | quote }}
      remoteRef:
        key: {{ $es.remoteKey | quote }}
        property: {{ .remoteProperty | quote }}
    {{- end }}
{{- end }}
